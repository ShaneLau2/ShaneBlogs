<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firefly Admin</title>
<style>
:root{--primary:#0891b2;--primary-hover:#0e7490;--bg:#f1f5f9;--sidebar-bg:#1e293b;--sidebar-text:#94a3b8;--sidebar-active:#0891b2;--card-bg:#fff;--text:#1e293b;--text-muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--success:#22c55e;--warning:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.sidebar-header{padding:1.25rem;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.sidebar-header h1{color:#fff;font-size:1.1rem;font-weight:600}
.sidebar-header p{font-size:.75rem;margin-top:.25rem}
.sidebar-nav{flex:1;overflow-y:auto;padding:.5rem 0}
.sidebar-nav a{display:flex;align-items:center;gap:.75rem;padding:.625rem 1.25rem;color:var(--sidebar-text);text-decoration:none;font-size:.875rem;transition:all .15s;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.sidebar-nav a:hover,.sidebar-nav a.active{background:rgba(255,255,255,.08);color:#fff}
.sidebar-nav a.active{border-right:3px solid var(--sidebar-active)}
.sidebar-nav .icon{width:1.25rem;text-align:center;font-size:1.1rem}
.sidebar-footer{padding:.75rem 1.25rem;border-top:1px solid rgba(255,255,255,.1);font-size:.75rem;color:var(--text-muted);flex-shrink:0}
.sidebar-footer a{color:#94a3b8}
.main{margin-left:240px;flex:1;padding:1.5rem;max-width:calc(100vw - 240px)}
.page-header{margin-bottom:1.5rem}
.page-header h2{font-size:1.5rem;font-weight:600}
.page-header p{color:var(--text-muted);font-size:.875rem;margin-top:.25rem}
.card{background:var(--card-bg);border-radius:.5rem;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:1.25rem;margin-bottom:1rem}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-bottom:.75rem;border-bottom:1px solid var(--border)}
.card-header h3{font-size:1rem;font-weight:600}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--card-bg);border-radius:.5rem;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:1.25rem}
.stat-card .value{font-size:1.75rem;font-weight:700;color:var(--primary)}
.stat-card .label{font-size:.8rem;color:var(--text-muted);margin-top:.25rem}
.btn{display:inline-flex;align-items:center;gap:.375rem;padding:.5rem 1rem;border-radius:.375rem;font-size:.875rem;font-weight:500;border:none;cursor:pointer;transition:all .15s;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#16a34a}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--bg)}
.btn-sm{padding:.375rem .75rem;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.375rem}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:.5rem .75rem;border:1px solid var(--border);border-radius:.375rem;font-size:.875rem;font-family:inherit;background:#fff}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(8,145,178,.15)}
.form-group textarea{min-height:100px;line-height:1.5}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-actions{display:flex;gap:.5rem;margin-top:1rem}
.table{width:100%;border-collapse:collapse;font-size:.875rem}
.table th,.table td{text-align:left;padding:.625rem .75rem;border-bottom:1px solid var(--border)}
.table th{font-weight:600;color:var(--text-muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
.table tr:hover td{background:#f8fafc}
.table .actions{display:flex;gap:.375rem}
.pl-drag-handle{cursor:grab;color:var(--text-muted);padding:0 .25rem;user-select:none}
.pl-drag-handle:hover{color:var(--primary)}
tr.pl-dragging{opacity:.4}
tr.pl-drag-over td{background:#e0f2fe;border-top:2px solid var(--primary)}
tr.pl-row{cursor:default}
tr.pl-row.pl-selected td{background:#ecfeff;box-shadow:inset 3px 0 0 var(--primary)}
tr.pl-row.pl-selected:hover td{background:#cffafe}
.tag{display:inline-block;padding:.125rem .5rem;border-radius:999px;font-size:.75rem;font-weight:500;background:#e0f2fe;color:#0369a1;margin:.125rem}
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.125rem .5rem;border-radius:999px;font-size:.7rem;font-weight:500}
.badge-success{background:#dcfce7;color:#166534}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-info{background:#e0f2fe;color:#0369a1}
.toast-container{position:fixed;top:1rem;right:1rem;z-index:999}
.toast{padding:.75rem 1rem;border-radius:.375rem;margin-bottom:.5rem;font-size:.875rem;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .2s ease}
.toast-success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.toast-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.toast-info{background:#e0f2fe;color:#0369a1;border:1px solid #bae6fd}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.loading{text-align:center;padding:2rem;color:var(--text-muted)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--text-muted)}
.empty-state .icon{font-size:2.5rem;margin-bottom:.75rem}
.table-wrap{overflow-x:auto}
.markdown-hint{font-size:.75rem;color:var(--text-muted);margin-top:.25rem}
.progress-bar{width:100%;height:.5rem;background:var(--border);border-radius:999px;overflow:hidden;margin:1rem 0}
.progress-bar .fill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
@media(max-width:768px){
.sidebar{width:56px}
.sidebar-header h1,.sidebar-header p,.sidebar-nav a span,.sidebar-footer{display:none}
.sidebar-nav a{justify-content:center;padding:.75rem}
.sidebar-nav .icon{margin:0}
.main{margin-left:56px;max-width:calc(100vw - 56px)}
.form-row{grid-template-columns:1fr}
.stats-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <h1>📝 Firefly</h1>
    <p>Admin Panel</p>
  </div>
  <nav class="sidebar-nav" id="nav">
    <a href="#dashboard" class="active" data-page="dashboard"><span class="icon">📊</span><span>Dashboard</span></a>
    <a href="#posts" data-page="posts"><span class="icon">📄</span><span>Posts</span></a>
    <a href="#dynamics" data-page="dynamics"><span class="icon">💬</span><span>Dynamics</span></a>
    <a href="#spec" data-page="spec"><span class="icon">📋</span><span>Pages</span></a>
    <a href="#config" data-page="config"><span class="icon">⚙️</span><span>Config</span></a>
    <a href="#announcement" data-page="announcement"><span class="icon">📢</span><span>Announcement</span></a>
    <a href="#music" data-page="music"><span class="icon">🎵</span><span>Music</span></a>
    <a href="#deploy" data-page="deploy"><span class="icon">🚀</span><span>Deploy</span></a>
  </nav>
  <div class="sidebar-footer" id="login-status"></div>
</div>

<div class="main" id="main-content">
  <div class="page-header">
    <h2 id="page-title">Dashboard</h2>
    <p id="page-desc">Overview of your blog</p>
  </div>
  <div id="page-content"></div>
</div>

<div class="toast-container" id="toast-container"></div>

<script type="module">
import { parseFrontmatter, buildFrontmatter } from "./frontmatter.js";
// ====== Mode detection ======
//  - online:  served from GitHub Pages, config.json has an apiBase pointing at
//             the Cloudflare Worker (GitHub OAuth + /api/gh proxy)
//  - local:   served by the Express admin server (no config.json)
let MODE = "local";
let API_BASE = "";
let config = {};
let authed = false;
let adminUser = null;
let currentPage = "dashboard";
let editingPlaylistIndex = -1; // index of the playlist row being edited
let dragPlaylistIndex = -1; // index of the playlist row being dragged
let selectedPlaylistIndex = -1; // index of the playlist row selected for keyboard reorder

// ====== App State & Navigation ======
function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll("[data-page]").forEach(el => el.classList.remove("active"));
  document.querySelector(`[data-page="${page}"]`)?.classList.add("active");
  history.replaceState(null, "", "#" + page);
  if (page !== "music") {
    editingPlaylistIndex = -1;
    selectedPlaylistIndex = -1;
  }
  renderPage(page);
}

window.addEventListener("hashchange", () => {
  const page = location.hash.slice(1) || "dashboard";
  if (page !== currentPage) navigateTo(page);
});

// Keyboard reorder: select a playlist row, then Alt+Up/Down moves it.
document.addEventListener("keydown", (e) => {
  if (!e.altKey || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
  if (currentPage !== "music" || editingPlaylistIndex >= 0) return;
  e.preventDefault();
  moveSelectedPlaylistTrack(e.key === "ArrowUp" ? -1 : 1);
});

// ====== Toast ======
function toast(message, type = "info") {
  const container = document.getElementById("toast-container");
  const el = document.createElement("div");
  el.className = "toast toast-" + type;
  el.textContent = message;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, 3000);
}

// ====== Low-level HTTP ======
async function apiLocal(path, options = {}) {
  const res = await fetch("/api" + path, {
    headers: { "Content-Type": "application/json", ...options.headers },
    ...options,
  });
  if (res.status === 401) {
    window.location.href = "/login.html";
    throw new Error("Unauthorized");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function apiGh(path, options = {}) {
  const res = await fetch(API_BASE + "/api/gh" + path, {
    credentials: "include",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/vnd.github.v3+json",
      ...options.headers,
    },
    ...options,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
  return data;
}

// Worker endpoints beyond the /api/gh proxy (e.g. music search/download).
async function apiWorker(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    credentials: "include",
    headers: { "Content-Type": "application/json", ...options.headers },
    ...options,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.message || `HTTP ${res.status}`);
  return data;
}

async function ghGet(path) { return apiGh(path); }
async function ghPut(path, body) { return apiGh(path, { method: "PUT", body: JSON.stringify(body) }); }
async function ghDelete(path, options) { return apiGh(path, { method: "DELETE", ...options }); }

async function ghReadFile(repoPath) {
  try {
    const data = await ghGet("/repos/" + config.repo + "/contents/" + repoPath + "?ref=" + config.branch);
    const raw = atob(data.content.replace(/\n/g, ""));
    let content;
    try { content = decodeURIComponent(escape(raw)); } catch { content = raw; }
    return { content, sha: data.sha };
  } catch { return { content: "", sha: null }; }
}

async function ghWriteFile(repoPath, content, message) {
  const existing = await ghReadFile(repoPath);
  const utf8 = unescape(encodeURIComponent(content));
  const b64 = btoa(utf8);
  return ghPut("/repos/" + config.repo + "/contents/" + repoPath, {
    message: message || "chore: update via admin panel",
    content: b64,
    sha: existing.sha || undefined,
    branch: config.branch,
  });
}

async function ghDeleteFile(repoPath, message) {
  const existing = await ghReadFile(repoPath);
  if (!existing.sha) return false;
  await ghDelete("/repos/" + config.repo + "/contents/" + repoPath, {
    body: JSON.stringify({ message: message || "chore: delete via admin panel", sha: existing.sha, branch: config.branch }),
  });
  return true;
}

async function ghListFiles(repoPath) {
  try {
    const data = await ghGet("/repos/" + config.repo + "/contents/" + repoPath + "?ref=" + config.branch);
    if (!Array.isArray(data)) return [];
    return data.filter(f => f.type === "file" && f.name !== ".gitkeep").map(f => f.name);
  } catch { return []; }
}

// ====== Unified data layer (mode-aware) ======
async function listPosts() {
  if (MODE === "local") {
    const { posts } = await apiLocal("/posts");
    return posts;
  }
  const files = await ghListFiles("src/content/posts");
  const posts = [];
  for (const f of files) {
    if (!/\.(md|mdx)$/.test(f)) continue;
    const { content } = await ghReadFile("src/content/posts/" + f);
    const { data } = parseFrontmatter(content);
    posts.push({ slug: f.replace(/\.(md|mdx)$/, ""), file: f, title: data.title || f, published: data.published || "", tags: data.tags || [], category: data.category || "", draft: !!data.draft, pinned: !!data.pinned });
  }
  return posts;
}

async function getPost(slug) {
  if (MODE === "local") return await apiLocal("/posts/" + encodeURIComponent(slug));
  let content = "";
  let md = await ghReadFile(`src/content/posts/${slug}.md`);
  let ext = ".md";
  if (!md.content) { md = await ghReadFile(`src/content/posts/${slug}.mdx`); ext = ".mdx"; }
  if (!md.content) throw new Error("Post not found");
  content = md.content;
  const { data, body } = parseFrontmatter(content);
  return { slug, frontmatter: data, body, ext };
}

async function savePostData(slug, frontmatter, body, isNew) {
  if (MODE === "local") {
    if (isNew) return await apiLocal("/posts", { method: "POST", body: JSON.stringify({ slug, frontmatter, body }) });
    return await apiLocal("/posts/" + encodeURIComponent(slug), { method: "PUT", body: JSON.stringify({ frontmatter, body }) });
  }
  const content = buildFrontmatter(frontmatter, body);
  await ghWriteFile(`src/content/posts/${slug}.md`, content, (isNew ? "Create" : "Update") + " post: " + (frontmatter.title || slug));
}

async function deletePostData(slug) {
  if (MODE === "local") return await apiLocal("/posts/" + encodeURIComponent(slug), { method: "DELETE" });
  const ok = await ghDeleteFile(`src/content/posts/${slug}.md`) || await ghDeleteFile(`src/content/posts/${slug}.mdx`);
  if (!ok) throw new Error("Post not found on GitHub");
}

async function listDynamics() {
  if (MODE === "local") {
    const { dynamics } = await apiLocal("/dynamics");
    return dynamics;
  }
  const files = await ghListFiles("src/content/dynamic");
  const out = [];
  for (const f of files) {
    if (!f.endsWith(".md")) continue;
    const { content } = await ghReadFile("src/content/dynamic/" + f);
    const { data } = parseFrontmatter(content);
    out.push({ slug: f.replace(/\.md$/, ""), file: f, published: data.published || "", pinned: !!data.pinned });
  }
  return out;
}

async function getDynamic(slug) {
  if (MODE === "local") return await apiLocal("/dynamics/" + encodeURIComponent(slug));
  const { content } = await ghReadFile(`src/content/dynamic/${slug}.md`);
  if (!content) throw new Error("Dynamic not found");
  const { data, body } = parseFrontmatter(content);
  return { slug, frontmatter: data, body };
}

async function saveDynamicData(slug, content, pinned, isNew) {
  if (MODE === "local") {
    if (isNew) return await apiLocal("/dynamics", { method: "POST", body: JSON.stringify({ content, pinned }) });
    return await apiLocal("/dynamics/" + encodeURIComponent(slug), { method: "PUT", body: JSON.stringify({ content, pinned }) });
  }
  const data = isNew
    ? { published: new Date().toISOString(), pinned: !!pinned }
    : (await getDynamic(slug)).frontmatter;
  if (!isNew) data.pinned = !!pinned;
  const fileContent = buildFrontmatter(data, content);
  await ghWriteFile(`src/content/dynamic/${isNew ? makeDynamicSlug() : slug}.md`, fileContent, isNew ? "New dynamic" : "Update dynamic");
}

function makeDynamicSlug() {
  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
}

async function deleteDynamicData(slug) {
  if (MODE === "local") return await apiLocal("/dynamics/" + encodeURIComponent(slug), { method: "DELETE" });
  const ok = await ghDeleteFile(`src/content/dynamic/${slug}.md`);
  if (!ok) throw new Error("Dynamic not found on GitHub");
}

async function listSpec() {
  if (MODE === "local") {
    const { pages } = await apiLocal("/spec");
    return pages;
  }
  const files = await ghListFiles("src/content/spec");
  const out = [];
  for (const f of files) {
    if (!/\.(md|mdx)$/.test(f)) continue;
    const { content } = await ghReadFile("src/content/spec/" + f);
    const { data } = parseFrontmatter(content);
    out.push({ slug: f.replace(/\.(md|mdx)$/, ""), file: f, title: data.title || f });
  }
  return out;
}

async function getSpec(slug) {
  if (MODE === "local") return await apiLocal("/spec/" + encodeURIComponent(slug));
  let content = "";
  let md = await ghReadFile(`src/content/spec/${slug}.md`);
  if (!md.content) { md = await ghReadFile(`src/content/spec/${slug}.mdx`); }
  content = md.content;
  if (!content) throw new Error("Page not found");
  const { data, body } = parseFrontmatter(content);
  return { slug, frontmatter: data, body };
}

async function saveSpec(slug, title, body) {
  if (MODE === "local") return await apiLocal("/spec/" + encodeURIComponent(slug), { method: "PUT", body: JSON.stringify({ title, body }) });
  const existing = await getSpec(slug);
  const data = { ...existing.frontmatter, title: title || existing.frontmatter.title };
  await ghWriteFile(`src/content/spec/${slug}.md`, buildFrontmatter(data, body), "Update " + slug);
}

const CONFIG_NAME_PATTERN = /^[A-Za-z0-9_-]+\.(ts|html|md)$/;

async function readConfigFile(name) {
  if (MODE === "local") {
    const { content } = await apiLocal("/config/" + name);
    return content;
  }
  const { content } = await ghReadFile("src/config/" + name);
  if (!content) throw new Error("Config not found");
  return content;
}

async function writeConfigFile(name, content) {
  if (MODE === "local") return await apiLocal("/config/" + name, { method: "PUT", body: JSON.stringify({ content }) });
  await ghWriteFile("src/config/" + name, content, "Update " + name);
}

async function readPlaylist() {
  if (MODE === "local") {
    const res = await fetch("/api/data/music-playlist.json");
    if (!res.ok) return [];
    return res.json().catch(() => []);
  }
  const { content } = await ghReadFile("src/data/music-playlist.json");
  if (!content) return [];
  try { return JSON.parse(content); } catch { return []; }
}

async function writePlaylist(list) {
  const content = JSON.stringify(list, null, "\t") + "\n";
  if (MODE === "local") {
    return await apiLocal("/data/music-playlist.json", { method: "PUT", body: JSON.stringify({ content }) });
  }
  await ghWriteFile("src/data/music-playlist.json", content, "Update music playlist");
}

async function deployStatus() {
  if (MODE === "local") return await apiLocal("/deploy/status");
  const ref = await ghGet("/repos/" + config.repo + "/git/ref/heads/" + config.branch);
  const commit = await ghGet("/repos/" + config.repo + "/git/commits/" + ref.object.sha);
  return { branch: config.branch, lastCommit: commit.message.split("\n")[0], hasChanges: false, changes: [], repo: config.repo };
}

async function doDeploy(message) {
  if (MODE === "local") {
    const result = await apiLocal("/deploy/sync", { method: "POST", body: JSON.stringify({ message }) });
    return { message: result.message, via: "git" };
  }
  await apiGh("/repos/" + config.repo + "/actions/workflows/deploy.yml/dispatches", { method: "POST", body: JSON.stringify({ ref: config.branch }) });
  return { message: "Deploy triggered! GitHub Actions will build and deploy.", via: "actions" };
}

// ====== Page renderer ======
async function renderPage(page) {
  const content = document.getElementById("page-content");
  const title = document.getElementById("page-title");
  const desc = document.getElementById("page-desc");
  content.innerHTML = '<div class="loading">Loading</div>';

  switch (page) {
    case "dashboard": renderDashboard(content, title, desc); break;
    case "posts": renderPosts(content, title, desc); break;
    case "dynamics": renderDynamics(content, title, desc); break;
    case "spec": renderSpec(content, title, desc); break;
    case "config": renderConfig(content, title, desc); break;
    case "announcement": renderAnnouncement(content, title, desc); break;
    case "music": renderMusic(content, title, desc); break;
    case "deploy": renderDeploy(content, title, desc); break;
    default: renderDashboard(content, title, desc);
  }
}

// ====== Dashboard ======
async function renderDashboard(el, title, desc) {
  title.textContent = "📊 Dashboard";
  desc.textContent = "Blog overview at a glance";
  try {
    const [posts, dynamics] = await Promise.all([listPosts().catch(() => []), listDynamics().catch(() => [])]);
    const publishedCount = posts.filter(p => !p.draft).length;
    const draftCount = posts.length - publishedCount;

    let extra = "";
    if (MODE === "local") {
      const deployStatusData = await deployStatus().catch(() => ({}));
      extra = `<div class="card">
        <div class="card-header"><h3>Git Status</h3></div>
        <p style="font-size:.875rem;margin-bottom:.5rem;"><strong>Branch:</strong> ${escapeHtml(deployStatusData.branch || "-")}</p>
        <p style="font-size:.875rem;margin-bottom:.5rem;"><strong>Last Commit:</strong> ${escapeHtml(deployStatusData.lastCommit || "-")}</p>
        <p style="font-size:.875rem;"><strong>Changes:</strong> ${deployStatusData.hasChanges ? deployStatusData.changes.length + " file(s) pending" : "Clean"}</p>
      </div>`;
    } else {
      extra = `<div class="card">
        <div class="card-header"><h3>Repository</h3></div>
        <p style="font-size:.875rem;margin-bottom:.5rem;"><strong>${escapeHtml(config.repo)}</strong> (${escapeHtml(config.branch)})</p>
        <p style="font-size:.875rem;">Signed in as <strong>${escapeHtml(adminUser?.login || "")}</strong> via GitHub OAuth.</p>
      </div>`;
    }

    el.innerHTML = `
      <div class="stats-grid">

async function savePost(e) {
  e.preventDefault();
  const form = e.target;
  const data = new FormData(form);
  const originalSlug = data.get("originalSlug");
  const slug = (data.get("slug") || "").trim();
  if (!slug) { toast("Slug is required", "error"); return; }
  const frontmatter = {
    title: data.get("title"),
    published: data.get("published") || new Date().toISOString().split("T")[0],
    description: data.get("description"),
    tags: data.get("tags").split(",").map(t => t.trim()).filter(Boolean),
    category: data.get("category"),
    draft: data.get("draft") !== null,
    pinned: data.get("pinned") !== null,
  };
  const body = data.get("body");
  try {
    if (originalSlug) {
      await savePostData(slug, frontmatter, body, false);
      toast("Post updated!", "success");
    } else {
      await savePostData(slug, frontmatter, body, true);
      toast("Post created!", "success");
    }
    renderPage("posts");
  } catch (err) {
    toast("Failed: " + err.message, "error");
  }
}

}

async function uploadMusic(e) {
  e.preventDefault();
  const form = e.target;
  const file = form.querySelector('[name="audio"]').files[0];
  const coverFile = form.querySelector('[name="cover"]').files[0];
  if (!file) { toast("Choose an audio file", "error"); return; }

  const rawName = file.name.replace(/\.[^.]+$/, "").replace(/[_-]/g, " ").replace(/\s+/g, " ").trim();
  const songName = rawName || "Unknown";
  const safeName = file.name.replace(/\.[^.]+$/, "").replace(/[^\p{L}\p{N}\s\-()]/gu, "").replace(/\s+/g, " ").trim().slice(0, 80);
  const ext = (file.name.match(/\.[^.]+$/)?.[0] || ".mp3").toLowerCase();

  if (MODE === "local") {
    const formData = new FormData();
    formData.set("name", songName);
    formData.set("artist", "Unknown");
    formData.set("audio", file);
    if (coverFile) formData.set("cover", coverFile);
    try {
      const res = await fetch("/api/music/upload-and-add", { method: "POST", body: formData });
      const result = await res.json();
      if (!result.success) throw new Error(result.error || "Upload failed");
      toast("Uploaded and added to playlist!", "success");
      renderPage("music");
    } catch (err) {
      toast("Upload failed: " + err.message, "error");
    }
    return;
  }

  // GitHub mode: upload via the worker proxy (base64)
  if (file.size > 10 * 1024 * 1024) {
    toast("File too large (>10MB). Use local admin instead.", "error");
    return;
  }
  try {
    const b64 = await readFileAsBase64(file);
    const cleanFile = safeName + ext;
    await ghPut("/repos/" + config.repo + "/contents/public/assets/music/" + cleanFile, {
      message: "Add music: " + songName,
      content: b64,
      branch: config.branch,
    });
    let coverClean = "";
    if (coverFile) {
      const coverExt = (coverFile.name.match(/\.[^.]+$/)?.[0] || ".png").toLowerCase();
      coverClean = safeName + "-cover" + coverExt;
      const coverB64 = await readFileAsBase64(coverFile);
      await ghPut("/repos/" + config.repo + "/contents/public/assets/music/cover/" + coverClean, {
        message: "Add cover: " + songName,
        content: coverB64,
        branch: config.branch,
      });
    }
    // structured playlist update
    const playlist = await readPlaylist();
    playlist.unshift({ name: songName, artist: "Unknown", url: "/assets/music/" + cleanFile, cover: coverClean ? "/assets/music/cover/" + coverClean : "", lrc: "" });
    await writePlaylist(playlist);
    toast("Uploaded and added to playlist! Redeploy to publish.", "success");
    renderPage("music");
  } catch (err) {
    toast("Upload failed: " + err.message, "error");
  }
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function deleteMusicFile(file) {
  if (!confirm(`Delete "${file}"?`)) return;
  try {
    if (MODE === "local") {
      await apiLocal("/music/" + encodeURIComponent(file), { method: "DELETE" });
    } else {
      const ok = await ghDeleteFile("public/assets/music/" + file);
      if (!ok) { toast("Not found", "error"); return; }
    }
    toast("Deleted", "success");
    renderPage("music");
  } catch (err) {
    toast("Failed: " + err.message, "error");
  }
}

async function searchMusic() {
  const q = document.getElementById("music-search-input").value.trim();
  if (!q) return;
  const div = document.getElementById("music-search-results");
  div.innerHTML = '<div class="loading">Searching mp3juice...</div>';
  try {
    const data = MODE === "local"
      ? await apiLocal("/music/mp3juice-search?q=" + encodeURIComponent(q))
      : await apiWorker("/api/music/search?q=" + encodeURIComponent(q));
    const r = data.results || [];
    if (r.length === 0) { div.innerHTML = '<div class="empty-state">No results found</div>'; return; }
    div.innerHTML = '<div style="margin-bottom:.5rem;font-size:.8rem;color:var(--text-muted);">' + r.length + ' results from mp3juice</div><div class="table-wrap"><table class="table"><thead><tr><th>Title</th><th>Duration</th><th>Actions</th></tr></thead><tbody>' +
      r.map(v => '<tr><td><strong>' + escapeHtml(v.title) + '</strong></td><td>' + escapeHtml(v.duration || "") + '</td><td class="actions"><button class="btn btn-primary btn-sm" data-id="' + escapeAttr(v.id) + '" data-title="' + escapeAttr(v.title) + '" onclick="downloadMusic(this)">Download</button></td></tr>').join("") +
      '</tbody></table></div>';
  } catch (err) {
    div.innerHTML = '<div class="empty-state">Error: ' + escapeHtml(err.message) + '</div>';
  }
}

async function downloadMusic(btn) {
  btn.disabled = true;
  btn.textContent = "Downloading...";
  try {
    const result = MODE === "local"
      ? await apiLocal("/music/playwright-download", {
          method: "POST",
          body: JSON.stringify({ videoId: btn.dataset.id, title: btn.dataset.title }),
        })
      : await apiWorker("/api/music/download", {
          method: "POST",
          body: JSON.stringify({
            videoId: btn.dataset.id,
            title: btn.dataset.title,
            repo: config.repo,
            branch: config.branch,
          }),
        });
    if (result.success) {
      toast("Downloaded and added to playlist!", "success");
      renderPage("music");
    } else {
      throw new Error(result.error || "Download failed");
    }
  } catch (err) {
    toast("Download failed: " + err.message, "error");
    btn.disabled = false;
    btn.textContent = "Download";
  }
}

// ====== Playlist editor ======
function coverSrc(p) {
  if (!p) return "";
  if (/^https?:\/\//.test(p)) return p;
  if (MODE === "local") return p;
  return "https://raw.githubusercontent.com/" + config.repo + "/" + config.branch + p;
}

function renderPlaylistRow(s, i) {
  const thumb = s.cover
    ? '<img src="' + escapeAttr(coverSrc(s.cover)) + '" style="width:36px;height:36px;object-fit:cover;border-radius:.25rem;">'
    : '<span style="color:var(--text-muted);font-size:.7rem;">—</span>';
  if (i === editingPlaylistIndex) {
    return '<tr data-edit-row>' +
      '<td>' + (i + 1) + '</td>' +
      '<td>' + thumb + '<input type="file" class="pl-cover-file" accept=".webp,.png,.jpg,.jpeg,.avif" style="display:block;width:100%;font-size:.65rem;margin-top:.25rem;"></td>' +
      '<td><input class="pl-name" value="' + escapeAttr(s.name || "") + '" style="width:100%;padding:.25rem .5rem;border:1px solid var(--border);border-radius:.25rem;"></td>' +
      '<td><input class="pl-artist" value="' + escapeAttr(s.artist || "") + '" style="width:100%;padding:.25rem .5rem;border:1px solid var(--border);border-radius:.25rem;"></td>' +
      '<td><input class="pl-url" value="' + escapeAttr(s.url || "") + '" style="width:100%;padding:.25rem .5rem;border:1px solid var(--border);border-radius:.25rem;font-size:.75rem;"></td>' +
      '<td class="actions">' +
        '<button class="btn btn-success btn-sm" data-i="' + i + '" onclick="savePlaylistTrack(this)">Save</button>' +
        '<button class="btn btn-outline btn-sm" onclick="cancelPlaylistEdit()">Cancel</button>' +
      '</td></tr>';
  }
  return '<tr draggable="true" data-i="' + i + '" class="pl-row' + (i === selectedPlaylistIndex ? ' pl-selected' : '') + '" onclick="selectPlaylistRow(this, event)" ondragstart="playlistDragStart(event, ' + i + ')" ondragover="playlistDragOver(event)" ondrop="playlistDrop(event, ' + i + ')" ondragend="playlistDragEnd()">' +
    '<td>' + (i + 1) + '</td>' +
    '<td>' + thumb + '</td>' +
    '<td>' + escapeHtml(s.name || "") + '</td>' +
    '<td>' + escapeHtml(s.artist || "") + '</td>' +
    '<td style="font-size:.8rem;">' + escapeHtml((s.url || "").split("/").pop()) + '</td>' +
    '<td class="actions">' +
      '<span class="pl-drag-handle" title="Drag to reorder">⠿</span>' +
      '<button class="btn btn-outline btn-sm" title="Edit" data-i="' + i + '" onclick="editPlaylistTrack(this)">✏️</button>' +
      '<button class="btn btn-danger btn-sm" title="Delete" data-i="' + i + '" onclick="deletePlaylistTrack(this)">🗑️</button>' +
    '</td></tr>';
}

function togglePlaylistForm() {
  const el = document.getElementById("playlist-add-form");
  if (el) el.style.display = el.style.display === "none" ? "block" : "none";
}

async function addPlaylistTrack(e) {
  e.preventDefault();
  const form = e.target;
  const name = form.name.value.trim();
  const url = form.url.value.trim();
  if (!name || !url) { toast("Name and URL are required", "error"); return; }
  const artist = form.artist.value.trim() || "Unknown";
  const lrc = form.lrc.value.trim() || "";
  const coverFile = form.cover.files[0];
  try {
    let cover = "";
    if (coverFile) cover = await uploadCoverFile(coverFile, name);
    const list = await readPlaylist();
    list.push({ name, artist, url, cover, lrc });
    await writePlaylist(list);
    toast("Track added", "success");
    renderPage("music");
  } catch (err) {
    toast("Failed to add track: " + err.message, "error");
  }
}

function editPlaylistTrack(btn) {
  editingPlaylistIndex = Number(btn.dataset.i);
  renderPage("music");
}

function cancelPlaylistEdit() {
  editingPlaylistIndex = -1;
  renderPage("music");
}

async function savePlaylistTrack(btn) {
  const i = Number(btn.dataset.i);
  const row = document.querySelector("[data-edit-row]");
  const name = row.querySelector(".pl-name").value.trim();
  const url = row.querySelector(".pl-url").value.trim();
  if (!name || !url) { toast("Name and URL are required", "error"); return; }
  const artist = row.querySelector(".pl-artist").value.trim() || "Unknown";
  const coverFile = row.querySelector(".pl-cover-file").files[0];
  try {
    const list = await readPlaylist();
    if (!list[i]) throw new Error("Track not found");
    let cover = list[i].cover || "";
    if (coverFile) cover = await uploadCoverFile(coverFile, name);
    list[i] = { ...list[i], name, artist, url, cover };
    await writePlaylist(list);
    editingPlaylistIndex = -1;
    toast("Track updated", "success");
    renderPage("music");
  } catch (err) {
    toast("Failed to update track: " + err.message, "error");
  }
}

async function deletePlaylistTrack(btn) {
  const i = Number(btn.dataset.i);
  if (!confirm("Remove this track from the playlist?")) return;
  try {
    const list = await readPlaylist();
    if (!list[i]) throw new Error("Track not found");
    list.splice(i, 1);
    await writePlaylist(list);
    toast("Track removed", "success");
    renderPage("music");
  } catch (err) {
    toast("Failed to remove track: " + err.message, "error");
  }
}

// ---- keyboard reorder (click a row, then Alt+Up/Down) ----
function selectPlaylistRow(row, ev) {
  if (ev.target.closest("button, input, span.pl-drag-handle")) return; // ignore clicks on row actions
  selectedPlaylistIndex = Number(row.dataset.i);
  document.querySelectorAll("tr.pl-row").forEach((r) => {
    r.classList.toggle("pl-selected", Number(r.dataset.i) === selectedPlaylistIndex);
  });
}

async function moveSelectedPlaylistTrack(dir) {
  const i = selectedPlaylistIndex;
  if (i < 0) { toast("Click a track first, then use Alt+↑/↓", "info"); return; }
  const j = i + dir;
  try {
    const list = await readPlaylist();
    if (j < 0 || j >= list.length) return;
    const tmp = list[i];
    list[i] = list[j];
    list[j] = tmp;
    selectedPlaylistIndex = j;
    await writePlaylist(list);
    renderPage("music");
  } catch (err) {
    toast("Failed to reorder: " + err.message, "error");
  }
}

// ---- drag & drop reorder ----
function playlistDragStart(ev, i) {
  dragPlaylistIndex = i;
  ev.dataTransfer.effectAllowed = "move";
  ev.dataTransfer.setData("text/plain", String(i));
  const row = ev.currentTarget;
  row.classList.add("pl-dragging");
}

function playlistDragOver(ev) {
  ev.preventDefault(); // required to allow drop
  ev.dataTransfer.dropEffect = "move";
  const row = ev.currentTarget.closest("tr");
  if (row && row !== ev.currentTarget) row.classList.add("pl-drag-over");
}

function playlistDragEnd() {
  dragPlaylistIndex = -1;
  document.querySelectorAll(".pl-dragging, .pl-drag-over").forEach((el) =>
    el.classList.remove("pl-dragging", "pl-drag-over"),
  );
}

async function playlistDrop(ev, toIndex) {
  ev.preventDefault();
  const fromIndex = dragPlaylistIndex;
  playlistDragEnd();
  if (fromIndex < 0 || fromIndex === toIndex) return;
  try {
    const list = await readPlaylist();
    if (fromIndex >= list.length || toIndex >= list.length) return;
    const [moved] = list.splice(fromIndex, 1);
    list.splice(toIndex, 0, moved);
    await writePlaylist(list);
    toast("Playlist reordered", "success");
    renderPage("music");
  } catch (err) {
    toast("Failed to reorder: " + err.message, "error");
  }
}

async function uploadCoverFile(file, baseName) {
  if (MODE === "local") {
    const formData = new FormData();
    formData.set("cover", file);
    const res = await fetch("/api/music/upload", { method: "POST", body: formData });
    const result = await res.json();
    if (!result.success || !result.cover) throw new Error(result.error || "Cover upload failed");
    return "/assets/music/cover/" + result.cover;
  }
  const ext = (file.name.match(/\.[^.]+$/)?.[0] || ".webp").toLowerCase();
  const safe = (baseName || "cover").replace(/[^\p{L}\p{N}\s\-()]/gu, "").replace(/\s+/g, " ").trim().slice(0, 80);
  const cleanName = (safe || "cover") + "-cover" + ext;
  const b64 = await readFileAsBase64(file);
  await ghPut("/repos/" + config.repo + "/contents/public/assets/music/cover/" + cleanName, {
    message: "Add cover: " + baseName,
    content: b64,
    branch: config.branch,
  });
  return "/assets/music/cover/" + cleanName;
}

// ====== Deploy ======
async function renderDeploy(el, title, desc) {
  title.textContent = "🚀 Deploy";
  desc.textContent = MODE === "local" ? "Sync changes to GitHub Pages" : "Trigger a GitHub Actions deploy";
  try {
    const status = await deployStatus();
    const isLocal = MODE === "local";

    el.innerHTML = `
      <div class="card">
        <div class="card-header"><h3>Status</h3></div>
        <p style="font-size:.875rem;margin-bottom:.5rem;"><strong>Branch:</strong> ${escapeHtml(status.branch || "-")}</p>
        <p style="font-size:.875rem;margin-bottom:.5rem;"><strong>Last Commit:</strong> ${escapeHtml(status.lastCommit || "-")}</p>
        ${isLocal ? `<p style="font-size:.875rem;"><strong>Pending Changes:</strong> ${status.hasChanges ? status.changes.length : "None — clean"}</p>
          ${status.hasChanges ? `<div class="table-wrap" style="margin-top:.75rem;"><table class="table"><thead><tr><th>Status</th><th>File</th></tr></thead><tbody>${status.changes.map(c => `<tr><td><span class="badge badge-warning">${escapeHtml(c.status)}</span></td><td style="font-size:.8rem;">${escapeHtml(c.file)}</td></tr>`).join("")}</tbody></table></div>` : ""}`
        : ""}
      </div>
      <div class="card">
        <div class="card-header"><h3>${isLocal ? "Sync to GitHub" : "Deploy"}</h3></div>
        <p style="font-size:.875rem;margin-bottom:.75rem;">
          ${isLocal
            ? "Commit all changes and push to GitHub. The GitHub Actions workflow will automatically build and deploy to Pages."
            : "Trigger the deploy.yml workflow via GitHub Actions. Push changes first if needed."}
        </p>
        <div class="form-group">
          <label>Commit Message</label>
          <input type="text" id="commit-message" value="${isLocal ? "chore: update blog content via admin panel" : "chore: update blog content"}" placeholder="Commit message">
        </div>
        <button class="btn btn-success" id="deploy-btn" onclick="syncDeploy()">🚀 ${isLocal ? "Sync & Deploy" : "Deploy"}</button>
      </div>
      <div id="deploy-result"></div>`;
  } catch (err) {
    el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>${escapeHtml(err.message)}</p></div>`;
  }
}

async function syncDeploy() {
  const btn = document.getElementById("deploy-btn");
  const resultEl = document.getElementById("deploy-result");
  const message = document.getElementById("commit-message").value;
  btn.disabled = true;
  resultEl.innerHTML = '<div class="loading">Working...</div>';
  try {
    const result = await doDeploy(message);
    resultEl.innerHTML = `<div class="card" style="border:2px solid var(--success);">
      <p style="color:var(--success);font-weight:500;">✅ ${escapeHtml(result.message)}</p>
      <p style="font-size:.8rem;color:var(--text-muted);margin-top:.5rem;">${result.via === "git" ? "GitHub Actions will deploy automatically. Check in a few minutes." : '<a href="https://github.com/' + escapeHtml(config.repo) + '/actions" target="_blank">View Actions →</a>'}</p>
    </div>`;
    toast("Deploy triggered!", "success");
    setTimeout(() => renderPage("deploy"), 2000);
  } catch (err) {
    btn.disabled = false;
    resultEl.innerHTML = `<div class="card" style="border:2px solid var(--danger);">
      <p style="color:var(--danger);font-weight:500;">❌ ${escapeHtml(err.message)}</p>
    </div>`;
    toast("Deploy failed: " + err.message, "error");
  }
}

// ====== Auth (online mode) ======
function renderLogin() {
  const el = document.getElementById("page-content");
  document.getElementById("page-title").textContent = "🔐 Login";
  document.getElementById("page-desc").textContent = "";
  el.innerHTML = `
    <div style="max-width:400px;margin:2rem auto;">
      <div class="card">
        <div class="card-header"><h3>Admin Login</h3></div>
        <p style="font-size:.875rem;color:var(--text-muted);margin-bottom:1rem;">Sign in with GitHub. Only the repository owner's account can manage the blog.</p>
        <a class="btn btn-primary" style="width:100%;justify-content:center;" href="${escapeAttr(API_BASE + "/api/oauth/authorize")}">🔑 Login with GitHub</a>
        <div class="markdown-hint" style="margin-top:.75rem;">Grant access to the <strong>${escapeHtml(config.repo || "")}</strong> repository only.</div>
      </div>
    </div>`;
}

function logout() {
  fetch(API_BASE + "/api/logout", { method: "POST", credentials: "include" }).finally(() => location.reload());
}

// ====== Utilities ======
function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  const div = document.createElement("div");
  div.textContent = String(str);
  return div.innerHTML;
}

function escapeAttr(str) {
  return escapeHtml(String(str ?? "")).replace(/"/g, "&quot;");
}

// ====== Init ======
(async function init() {
  // Detect mode: online config.json carries apiBase; local Express has none.
  try {
    const res = await fetch("config.json");
    if (res.ok) {
      config = await res.json();
      document.title = config.title || "Firefly Admin";
      if (config.apiBase) {
        MODE = "github";
        API_BASE = config.apiBase;
      }
    }
  } catch { /* local mode */ }

  const footer = document.getElementById("login-status");

  if (MODE === "github") {
    try {
      const me = await fetch(API_BASE + "/api/me", { credentials: "include" });
      if (me.ok) {
        adminUser = await me.json();
        authed = true;
        footer.innerHTML = "✅ " + escapeHtml(adminUser.login) + ' · <a href="#" onclick="logout();return false;">logout</a>';
      }
    } catch { /* worker unreachable */ }
    if (!authed) {
      footer.textContent = "Not signed in";
      renderLogin();
      return;
    }
  } else {
    footer.textContent = "Local mode · port 3000";
  }

  navigateTo(location.hash.slice(1) || "dashboard");
})();

// Functions referenced by inline onclick attributes must be global.
Object.assign(window, {
	navigateTo,
	showPostForm,
	savePost,
	deletePost,
	saveDynamic,
	showDynamicForm,
	cancelDynamicEdit,
	deleteDynamic,
	editSpecPage,
	saveSpecPage,
	editConfigFile,
	saveConfigFile,
	searchMusic,
	downloadMusic,
	deleteMusicFile,
	togglePlaylistForm,
	addPlaylistTrack,
	editPlaylistTrack,
	cancelPlaylistEdit,
	savePlaylistTrack,
	deletePlaylistTrack,
	selectPlaylistRow,
	moveSelectedPlaylistTrack,
	playlistDragStart,
	playlistDragOver,
	playlistDragEnd,
	playlistDrop,
	syncDeploy,
	logout,
});
</script>
