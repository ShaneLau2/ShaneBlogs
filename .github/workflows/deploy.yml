# GitHub Pages Deploy Workflow
# Deploys the Astro site to GitHub Pages on push to the main branch.
# https://docs.astro.build/en/guides/deploy/github-pages/

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allow manual triggering from Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Auto-format code
        run: |
          pnpm format
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: auto-format code [skip ci]"
            git push
          fi

      - name: Build the site
        run: |
          echo "NO_FONTS=$NO_FONTS"
          pnpm build
        env:
          ASTRO_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Hard-code the repo name for base path — this is the most reliable approach
          ASTRO_BASE: /ShaneBlogs/
          # CI can't fetch fonts from CDN, use system fonts fallback
          NO_FONTS: "true"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
